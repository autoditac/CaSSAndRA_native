name: Native builds

on:
  workflow_dispatch:
  push:
    branches:
      - feature/mqtt-tls-port-support

jobs:
  android:
    name: Android arm64 APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cassandra_native
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Pixel 9 Pro XL APK
        run: flutter build apk --release --split-per-abi

      - name: Collect APK
        run: |
          mkdir -p build/artifacts
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/artifacts/cassandra-native-pixel9proxl-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cassandra-native-pixel9proxl-arm64-apk
          path: cassandra_native/build/artifacts/cassandra-native-pixel9proxl-arm64.apk
          if-no-files-found: error

  linux-flatpak:
    name: Linux Flatpak
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cassandra_native
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux and Flatpak build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            clang \
            cmake \
            desktop-file-utils \
            flatpak \
            flatpak-builder \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            mpv \
            ninja-build \
            patchelf \
            pkg-config
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release bundle
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release

      - name: Bundle libmpv runtime libraries
        run: |
          python3 <<'PY'
          import re
          import shutil
          import subprocess
          from pathlib import Path

          bundle_lib = Path('build/linux/x64/release/bundle/lib')
          bundle_lib.mkdir(parents=True, exist_ok=True)
          roots = [Path('/usr/lib/x86_64-linux-gnu/libmpv.so.2')]
          skip = re.compile(
              r'^(linux-vdso|ld-linux|libc\.so|libm\.so|libpthread\.so|'
              r'libdl\.so|librt\.so|libresolv\.so|libgcc_s\.so|'
              r'libstdc\+\+\.so)'
          )
          copied = set()
          queue = list(roots)

          def dependencies(path: Path) -> list[Path]:
              result = subprocess.run(
                  ['ldd', str(path)],
                  text=True,
                  check=True,
                  stdout=subprocess.PIPE,
              )
              deps = []
              for line in result.stdout.splitlines():
                  line = line.strip()
                  if '=>' in line:
                      candidate = line.split('=>', 1)[1].strip().split(' ', 1)[0]
                  else:
                      candidate = line.split(' ', 1)[0]
                  if candidate.startswith('/'):
                      deps.append(Path(candidate))
              return deps

          while queue:
              source = queue.pop(0)
              if not source.exists() or skip.match(source.name):
                  continue
              real_source = source.resolve()
              key = (source.name, str(real_source))
              if key in copied:
                  continue
              copied.add(key)
              shutil.copy2(real_source, bundle_lib / source.name)
              queue.extend(dependencies(real_source))

          for library in sorted(copied):
              print('bundled', library[0])
          PY
          find build/linux/x64/release/bundle/lib -maxdepth 1 -type f -name '*.so*' -print0 | xargs -0 -r patchelf --set-rpath '$ORIGIN'
          ldd build/linux/x64/release/bundle/cassandra_native | grep -E 'libmpv|not found'

      - name: Build Flatpak bundle
        run: |
          mkdir -p build/artifacts
          flatpak-builder --force-clean --repo=build/flatpak-repo build/flatpak-build packaging/flatpak/io.github.autoditac.cassandra_native.yml
          flatpak build-bundle build/flatpak-repo build/artifacts/io.github.autoditac.cassandra_native.flatpak io.github.autoditac.cassandra_native

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: cassandra-native-linux-flatpak
          path: cassandra_native/build/artifacts/io.github.autoditac.cassandra_native.flatpak
          if-no-files-found: error
